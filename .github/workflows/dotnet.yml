name: .NET CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NuGet cache (cache: true) is deliberately omitted until the first PackageReference
      # exists: with zero packages to restore, ~/.nuget/packages/ is never created and the
      # post-step fails trying to cache a path that doesn't exist on disk.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build
